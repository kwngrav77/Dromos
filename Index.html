<!DOCTYPE html><html lang='el'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Love Cat Game</title><style>body{margin:0;overflow:hidden;background:linear-gradient(#87CEEB,#dff7ff);font-family:Arial}#game{position:relative;width:100vw;height:100vh}#ground{position:absolute;bottom:0;height:120px;width:100%;background:#5dbb63}#cat{position:absolute;left:70px;bottom:120px;font-size:64px}#score{position:absolute;top:15px;left:15px;font-size:30px;color:#fff;text-shadow:1px 1px 3px #000}#msg{display:none;position:absolute;inset:0;background:rgba(255,105,180,.9);color:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center}button{padding:14px 28px;font-size:22px;border-radius:30px;border:none}</style></head><body><div id='game'><div id='score'>0 / 5 ❤️</div><div id='cat'>🐱</div><div id='ground'></div><div id='msg'></div></div><script>const g=document.getElementById('game'),c=cat,s=score,m=msg;let y=0,v=0,j=false,p=0,o;function mk(){o=document.createElement('div');o.textContent='🌵';o.style.position='absolute';o.style.bottom='120px';o.style.fontSize='55px';o.x=innerWidth+50;g.appendChild(o)}mk();function jump(){if(!j){v=18;j=true}}addEventListener('touchstart',jump);addEventListener('mousedown',jump);function win(){m.style.display='flex';m.innerHTML='<h1>🎉 ΜΠΡΑΒΟΟΟΟ ❤️</h1><h2>LOVE YOU ΜΠΟΥΛΗΗΗ...<br>ΓΙΑ ΣΕΕΕΕΝΑΑΑ 💕</h2><button onclick=location.reload()>Παίξε ξανά</button>';}function lose(){m.style.display='flex';m.innerHTML='<h1>😿</h1><h2>Ξαναπροσπάθησε αγάπη μου ❤️</h2><button onclick=location.reload()>Παίξε ξανά</button>';}function loop(){v-=1;y+=v;if(y<0){y=0;v=0;j=false}c.style.bottom=(120+y)+'px';o.x-=7;o.style.left=o.x+'px';if(o.x<120&&o.x>55&&y<65)return lose();if(o.x<-40){o.remove();p++;s.textContent=p+' / 5 ❤️';if(p>=5)return win();mk()}requestAnimationFrame(loop)}loop();</script></body></html>
