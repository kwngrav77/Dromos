<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5d55c8" />
    <meta
      name="description"
      content="ΛογοΠαιχνίδι Pro — επεξεργάσιμη αυτόνομη εφαρμογή λογοθεραπείας"
    />
    <title>ΛογοΠαιχνίδι Pro</title>
    <style>
      :root {
        --canvas: #f5f2ec;
        --surface: #fffdf9;
        --surface-strong: #ffffff;
        --ink: #1d2440;
        --ink-soft: #687083;
        --line: #e5e0d7;
        --line-strong: #d9d3c9;
        --primary: #5f55c7;
        --primary-dark: #443ba2;
        --primary-soft: #eeebff;
        --mint: #4c9b7a;
        --mint-soft: #e9f6ef;
        --coral: #d9795b;
        --coral-soft: #faeee8;
        --gold: #b38a36;
        --gold-soft: #fbf3dc;
        --shadow-sm: 0 7px 22px rgba(35, 37, 63, 0.055);
        --shadow-md: 0 22px 55px rgba(35, 37, 63, 0.09);
        --radius-sm: 14px;
        --radius-md: 20px;
        --radius-lg: 28px;
      }

      * {
        box-sizing: border-box;
      }
      html {
        background: var(--canvas);
        color: var(--ink);
      }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--canvas);
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid rgba(95, 85, 199, 0.24);
        outline-offset: 2px;
      }

      .ui-icon {
        display: block;
        flex: 0 0 auto;
      }
      .eyebrow {
        display: block;
        color: var(--ink-soft);
        font-size: 11px;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: 0.095em;
        text-transform: uppercase;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 19px;
        white-space: nowrap;
      }
      .brand b {
        color: var(--primary);
        font-family: Inter, sans-serif;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--primary-soft);
        border: 1px solid #dcd7ff;
        border-radius: 999px;
        padding: 4px 6px;
        vertical-align: 2px;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        box-shadow: 0 9px 22px rgba(95, 85, 199, 0.24);
      }
      .brand-mark i {
        display: block;
        width: 2px;
        border-radius: 9px;
        background: white;
        opacity: 0.94;
      }
      .brand-mark i:nth-child(1),
      .brand-mark i:nth-child(5) {
        height: 8px;
      }
      .brand-mark i:nth-child(2),
      .brand-mark i:nth-child(4) {
        height: 16px;
      }
      .brand-mark i:nth-child(3) {
        height: 22px;
      }

      .primary-button,
      .secondary-button,
      .text-button {
        min-height: 48px;
        border: 0;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-weight: 760;
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease,
          background 0.16s ease;
      }
      .primary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: var(--primary);
        color: white;
        padding: 0 20px;
        box-shadow: 0 12px 28px rgba(95, 85, 199, 0.2);
      }
      .primary-button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }
      .primary-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }
      .secondary-button {
        padding: 0 20px;
        background: #f4f1ec;
        border: 1px solid var(--line);
      }
      .text-button {
        min-height: 42px;
        padding: 0 8px;
        color: var(--primary);
        background: transparent;
      }

      .onboarding {
        min-height: 100svh;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 75% 18%, #eeeafd 0, transparent 28%),
          linear-gradient(145deg, #faf8f4 0%, #f3f0ea 100%);
      }
      .onboarding-glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
        opacity: 0.72;
      }
      .glow-one {
        width: 420px;
        height: 420px;
        left: -260px;
        top: 35%;
        background: #eaf6ef;
      }
      .glow-two {
        width: 340px;
        height: 340px;
        right: -220px;
        bottom: -100px;
        background: #f7e9e1;
      }
      .onboarding-inner {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
        position: relative;
        z-index: 2;
        padding: 28px 0 42px;
      }
      .onboarding-hero {
        min-height: 560px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(390px, 0.85fr);
        align-items: center;
        gap: 72px;
      }
      .onboarding-copy {
        max-width: 620px;
      }
      .onboarding-copy h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(45px, 5vw, 72px);
        line-height: 1.02;
        letter-spacing: -0.045em;
        font-weight: 500;
        margin: 20px 0 24px;
      }
      .onboarding-copy h1 em {
        color: var(--primary);
        font-weight: inherit;
      }
      .onboarding-copy > p {
        max-width: 600px;
        color: var(--ink-soft);
        font-size: 17px;
        line-height: 1.75;
        margin: 0;
      }
      .onboarding-actions {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 34px;
        flex-wrap: wrap;
      }
      .onboarding-preview {
        position: relative;
        min-height: 450px;
        display: grid;
        place-items: center;
      }
      .preview-card {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(222, 216, 208, 0.9);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(14px);
      }
      .preview-main {
        width: min(100%, 420px);
        border-radius: 30px;
        padding: 26px;
        transform: rotate(1.5deg);
        position: relative;
        z-index: 3;
      }
      .preview-label,
      .preview-stat small {
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.1em;
        color: var(--ink-soft);
      }
      .preview-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px 0 18px;
      }
      .preview-avatar {
        width: 45px;
        height: 45px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        color: var(--primary);
        background: var(--primary-soft);
        font-size: 12px;
        font-weight: 850;
      }
      .preview-row div {
        display: grid;
        gap: 3px;
      }
      .preview-row div b {
        font-size: 17px;
      }
      .preview-row div small {
        color: var(--ink-soft);
      }
      .preview-sound {
        margin-left: auto;
        font-family: Georgia, serif;
        font-size: 31px;
      }
      .preview-target {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 15px 0;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--ink-soft);
      }
      .preview-target b {
        color: var(--ink);
      }
      .preview-button {
        height: 57px;
        margin-top: 12px;
        background: var(--primary);
        color: white;
        border-radius: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 760;
      }
      .preview-play {
        width: 29px;
        height: 29px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
        font-size: 10px;
      }
      .preview-stat {
        position: absolute;
        z-index: 4;
        right: -22px;
        bottom: 24px;
        width: 170px;
        border-radius: 22px;
        padding: 18px;
        transform: rotate(-4deg);
      }
      .preview-stat b {
        display: block;
        font-family: Georgia, serif;
        font-size: 38px;
        color: var(--mint);
        margin: 7px 0 2px;
      }
      .preview-stat span {
        color: var(--mint);
        font-size: 11px;
        font-weight: 750;
      }
      .preview-orbit {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(95, 85, 199, 0.13);
      }
      .orbit-one {
        width: 410px;
        height: 410px;
      }
      .orbit-two {
        width: 510px;
        height: 510px;
      }
      .onboarding-features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 13px;
      }
      .onboarding-features article {
        min-height: 112px;
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 19px;
        border: 1px solid rgba(224, 219, 211, 0.85);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.64);
        backdrop-filter: blur(10px);
      }
      .feature-icon {
        width: 48px;
        height: 48px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .feature-icon.lavender {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .feature-icon.mint {
        background: var(--mint-soft);
        color: var(--mint);
      }
      .feature-icon.sand {
        background: var(--gold-soft);
        color: var(--gold);
      }
      .onboarding-features b {
        display: block;
        margin-bottom: 5px;
      }
      .onboarding-features p {
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.5;
        margin: 0;
      }
      .loading-screen {
        min-height: 100svh;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 22px;
        background: radial-gradient(
          circle at 50% 42%,
          #eeebff,
          transparent 34%
        );
      }
      .loading-screen .brand {
        position: absolute;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
      }
      .loading-screen > p {
        color: var(--ink-soft);
        font-size: 12px;
      }
      .loading-mark {
        width: 78px;
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border-radius: 25px;
        color: white;
        background: var(--primary);
        box-shadow: 0 20px 42px rgba(95, 85, 199, 0.24);
      }
      .loading-mark i {
        width: 3px;
        border-radius: 9px;
        background: white;
        animation: loading-wave 1s ease-in-out infinite alternate;
      }
      .loading-mark i:nth-child(1),
      .loading-mark i:nth-child(5) {
        height: 13px;
      }
      .loading-mark i:nth-child(2),
      .loading-mark i:nth-child(4) {
        height: 27px;
        animation-delay: 0.15s;
      }
      .loading-mark i:nth-child(3) {
        height: 40px;
        animation-delay: 0.3s;
      }
      @keyframes loading-wave {
        to {
          transform: scaleY(0.55);
          opacity: 0.65;
        }
      }

      .app-shell {
        width: min(100%, 720px);
        min-height: 100svh;
        margin: 0 auto;
        padding: 0 18px 114px;
      }
      .app-header {
        position: sticky;
        top: 0;
        z-index: 40;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: linear-gradient(var(--canvas) 78%, rgba(245, 242, 236, 0));
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .sync-pill {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 11px;
        border: 1px solid #cfe6d9;
        border-radius: 999px;
        color: #39785f;
        background: #edf8f2;
        font-size: 11px;
        font-weight: 750;
        white-space: nowrap;
      }
      .calendar-button {
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: white;
        color: var(--primary);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .child-switcher {
        height: 42px;
        max-width: 105px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: white;
        color: var(--ink);
        padding: 0 30px 0 12px;
        font-weight: 780;
      }
      .app-content {
        padding-top: 7px;
      }
      .screen-stack {
        display: grid;
        gap: 14px;
      }

      .today-hero {
        overflow: hidden;
        position: relative;
        border-radius: var(--radius-lg);
        padding: 24px;
        color: white;
        background: linear-gradient(
          135deg,
          #5148b7 0%,
          #6960ce 58%,
          #7971d9 100%
        );
        box-shadow: 0 21px 42px rgba(75, 67, 170, 0.2);
      }
      .today-hero::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        right: -95px;
        top: -100px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 50%;
        box-shadow:
          0 0 0 32px rgba(255, 255, 255, 0.035),
          0 0 0 68px rgba(255, 255, 255, 0.025);
      }
      .today-hero-top {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 22px;
      }
      .today-hero .eyebrow {
        color: rgba(255, 255, 255, 0.66);
      }
      .today-hero h1 {
        font-family: Georgia, serif;
        font-size: 36px;
        font-weight: 500;
        margin: 8px 0 6px;
      }
      .today-hero-top p {
        display: flex;
        align-items: center;
        gap: 6px;
        color: rgba(255, 255, 255, 0.76);
        font-size: 13px;
        margin: 0;
      }
      .sound-medallion {
        width: 86px;
        height: 86px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        flex: 0 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.11);
        backdrop-filter: blur(12px);
      }
      .sound-medallion span {
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.1em;
        opacity: 0.7;
      }
      .sound-medallion b {
        font-family: Georgia, serif;
        font-size: 32px;
        font-weight: 500;
      }
      .session-plan-row {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin: 22px 0 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      }
      .session-plan-row div {
        padding: 14px 5px;
        display: grid;
        gap: 3px;
      }
      .session-plan-row div + div {
        border-left: 1px solid rgba(255, 255, 255, 0.14);
        padding-left: 18px;
      }
      .session-plan-row span {
        color: rgba(255, 255, 255, 0.62);
        font-size: 10px;
        font-weight: 700;
      }
      .session-plan-row b {
        font-size: 13px;
      }
      .session-start {
        position: relative;
        z-index: 2;
        width: 100%;
        min-height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 0;
        border-radius: 18px;
        padding: 0 16px;
        background: white;
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 12px 25px rgba(39, 34, 101, 0.2);
      }
      .session-start > span:nth-child(2) {
        text-align: left;
        display: grid;
        gap: 2px;
        font-weight: 800;
      }
      .session-start small {
        color: var(--ink-soft);
        font-size: 8px;
        letter-spacing: 0.09em;
      }
      .session-start > .ui-icon {
        margin-left: auto;
        color: var(--primary);
      }
      .play-circle {
        width: 37px;
        height: 37px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: var(--primary);
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .metric-card {
        position: relative;
        overflow: hidden;
        min-height: 118px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 16px;
        background: var(--surface-strong);
        box-shadow: var(--shadow-sm);
      }
      .metric-label {
        display: block;
        min-height: 24px;
        color: var(--ink-soft);
        font-size: 8.5px;
        line-height: 1.35;
        font-weight: 850;
        letter-spacing: 0.075em;
      }
      .metric-card > b {
        display: block;
        font-family: Georgia, serif;
        font-size: 28px;
        font-weight: 500;
        margin: 5px 0 2px;
      }
      .metric-card > small {
        color: var(--ink-soft);
        font-size: 10px;
      }
      .metric-card.purple > b {
        color: var(--primary);
      }
      .metric-card.green > b {
        color: var(--mint);
      }
      .metric-card.gold > b {
        color: var(--gold);
      }
      .metric-spark {
        position: absolute;
        right: 11px;
        bottom: 10px;
        height: 25px;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        opacity: 0.35;
      }
      .metric-spark i {
        width: 2px;
        border-radius: 9px;
        background: currentColor;
      }
      .metric-spark i:nth-child(1) {
        height: 6px;
      }
      .metric-spark i:nth-child(2) {
        height: 13px;
      }
      .metric-spark i:nth-child(3) {
        height: 9px;
      }
      .metric-spark i:nth-child(4) {
        height: 20px;
      }
      .metric-spark i:nth-child(5) {
        height: 15px;
      }
      .metric-spark i:nth-child(6) {
        height: 24px;
      }

      .content-card {
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 21px;
        background: var(--surface-strong);
        box-shadow: var(--shadow-sm);
      }
      .section-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }
      .section-heading h2 {
        font-family: Georgia, serif;
        font-size: 22px;
        font-weight: 500;
        margin: 5px 0 0;
      }
      .count-pill {
        padding: 6px 9px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 10px;
        font-weight: 780;
      }
      .section-link {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        border: 0;
        background: transparent;
        color: var(--primary);
        padding: 6px 0;
        font-size: 11px;
        font-weight: 780;
        cursor: pointer;
        white-space: nowrap;
      }
      .sound-groups {
        display: grid;
        gap: 11px;
      }
      .sound-group {
        display: grid;
        grid-template-columns: 82px 1fr;
        align-items: center;
        gap: 7px;
      }
      .sound-group > span {
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 720;
      }
      .sound-group > div {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .sound-group button {
        min-width: 46px;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fbfaf7;
        color: var(--ink);
        cursor: pointer;
        font-family: Georgia, serif;
        font-size: 15px;
      }
      .sound-group button.active {
        border-color: var(--primary);
        color: white;
        background: var(--primary);
        box-shadow: 0 8px 18px rgba(95, 85, 199, 0.2);
      }
      .sound-tip {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        margin-top: 17px;
        padding: 13px;
        border-radius: 15px;
        background: #f7f5ff;
      }
      .tip-mark {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: var(--primary);
        font-family: Georgia, serif;
        font-size: 13px;
      }
      .sound-tip p {
        color: var(--ink-soft);
        font-size: 11px;
        line-height: 1.55;
        margin: 0;
      }
      .sound-tip b {
        display: block;
        color: var(--ink);
        margin-bottom: 3px;
      }

      .practice-section,
      .games-section {
        padding: 7px 2px 0;
      }
      .level-list {
        display: grid;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);

                primarySoundId: child.primarySoundId || child.phonemeId || "r",
                createdAt: child.createdAt || new Date().toISOString(),
              }))
            : [];
          let appointments = Array.isArray(raw.appointments)
            ? raw.appointments
            : [];
          const schedule = Array.isArray(raw.schedule)
            ? raw.schedule
                .filter((slot) => slot && (slot.childId || slot.child))
                .map((slot) => ({
                  id: String(slot.id || uid("slot")),
                  childId: String(slot.childId || slot.child || ""),
                  day: clampDay(slot.day),
                  time: String(slot.time || "17:00"),
                  duration: Number(slot.duration || slot.minutes || 45),
                }))
            : [];
          const attendance = Array.isArray(raw.attendance)
            ? raw.attendance
                .filter((rec) => rec && rec.date)
                .map((rec) => ({
                  id: String(rec.id || uid("att")),
                  slotId: String(rec.slotId || ""),
                  childId: String(rec.childId || ""),
                  date: String(rec.date),
                  status: ["came", "cancelled", "none"].includes(rec.status)
                    ? rec.status
                    : "came",
                  duration: Number(rec.duration || 45),
                  adhoc: Boolean(rec.adhoc),
                  log: Array.isArray(rec.log) ? rec.log : [],
                }))
            : [];
          const selectedChildId =
            raw.selectedChildId ||
            raw.currentChildId ||
            children[0]?.id ||
            null;
          return {
            ...base,
            ...raw,
            version: 6,
            selectedChildId,
            children,
            sessions: Array.isArray(raw.sessions)
              ? raw.sessions.map(normalizeSession)
              : [],
            appointments,
            schedule,
            attendance,
            therapist: { ...base.therapist, ...(raw.therapist || {}) },
            onboardingComplete: Boolean(
              raw.onboardingComplete ?? children.length,
            ),
            updatedAt: raw.updatedAt || new Date().toISOString(),
          };
        }

            } catch {
              /* keep looking */
            }

          return emptyDb();

            phrases: "sentences",
            sentences: "spontaneous",
            spontaneous: "spontaneous",

          const index = levelOrder.indexOf(current);
          return latest.score >= 80
            ? recommendedNext[current] ||
                levelOrder[Math.min(index + 1, levelOrder.length - 1)]

        const DAY_NAMES = [
          "Δευτέρα",
          "Τρίτη",
          "Τετάρτη",
          "Πέμπτη",
          "Παρασκευή",
          "Σάββατο",

        function clampDay(value) {
          const day = Number(value);
          return Number.isFinite(day) && day >= 0 && day <= 6 ? day : 0;

        function ensureLists() {
          if (!Array.isArray(db.schedule)) db.schedule = [];

        function weekdayOf(dateStr) {
          const date = dateStr ? new Date(`${dateStr}T12:00:00`) : new Date();

        function slotsForDate(dateStr) {
          const day = weekdayOf(dateStr);
          return db.schedule
            .filter((slot) => slot.day === day)
            .sort((a, b) => String(a.time).localeCompare(String(b.time)));
        }

        function adhocSlotId(childId, dateStr) {
          return `adhoc:${childId}:${dateStr}`;
        }

        function attendanceOf(slotId, dateStr) {
          return db.attendance.find(
            (rec) => rec.slotId === slotId && rec.date === dateStr,
          );
        }

        function markAttendance(slotId, status, dateStr) {
          const date = dateStr || isoDate();
          const now = new Date().toISOString();
          const existing = attendanceOf(slotId, date);
          if (existing) {
            const next = existing.status === status ? "none" : status;
            existing.status = next;
            existing.log = [
              ...(existing.log || []),
              { at: now, status: next, by: "manual" },
            ];
          } else {
            const slot = db.schedule.find((item) => item.id === slotId);
            db.attendance.push({
              id: uid("att"),
              slotId,
              childId: slot ? slot.childId : "",
              date,
              status,
              duration: slot ? slot.duration : 45,
              adhoc: !slot,
              log: [{ at: now, status, by: "manual" }],
            });
          }
          saveDb();
        }

        function autoMarkAttendance(childId) {
          if (!childId) return;
          ensureLists();
          const date = isoDate();
          const now = new Date().toISOString();
          const day = weekdayOf(date);
          const slot = db.schedule.find(
            (item) => item.childId === childId && item.day === day,
          );
          const slotId = slot ? slot.id : adhocSlotId(childId, date);
          const existing = attendanceOf(slotId, date);
          if (existing) {
            if (existing.status !== "came") {
              existing.status = "came";
              existing.log = [
                ...(existing.log || []),
                { at: now, status: "came", by: "session" },
              ];
            }
            return;
          }
          const fallback = db.schedule.find((item) => item.childId === childId);
          db.attendance.push({
            id: uid("att"),
            slotId,
            childId,
            date,
            status: "came",
            duration: slot
              ? slot.duration
              : fallback
                ? fallback.duration
                : 45,
            adhoc: !slot,
            log: [{ at: now, status: "came", by: "session" }],
          });
        }

        function dayDots(dateStr) {
          const dots = db.appointments
            .filter((item) => item.date === dateStr)
            .map((item) => item.status || "planned");
          slotsForDate(dateStr).forEach((slot) => {
            const rec = attendanceOf(slot.id, dateStr);
            if (rec && rec.status === "came") dots.push("attended");
            else if (rec && rec.status === "cancelled") dots.push("cancelled");
            else dots.push("planned");
          });
          db.attendance
            .filter(
              (rec) => rec.date === dateStr && rec.adhoc && rec.status !== "none",
            )
            .forEach((rec) =>
              dots.push(rec.status === "cancelled" ? "cancelled" : "attended"),
            );
          return dots;
        }

        function monthMinutes(childId, year, month) {
          return db.attendance
            .filter((rec) => {
              if (rec.childId !== childId || rec.status !== "came") return false;
              const date = new Date(`${rec.date}T12:00:00`);
              return date.getFullYear() === year && date.getMonth() === month;
            })
            .reduce((total, rec) => total + Number(rec.duration || 45), 0);
        }

        function attendanceRow(slotId, date, name, time, duration, rec, adhoc) {
          const status = rec ? rec.status : "none";
          return `<article class="appointment-row">
        <div class="date-tile"><b>${esc(adhoc ? "•" : String(time).slice(0, 2))}</b><span>${esc(adhoc ? "έκτακτο" : String(time).slice(3))}</span></div>
        <div class="appointment-copy"><b>${esc(name)}</b><span>${Number(duration) || 45} λεπτά${adhoc ? " · εκτός προγράμματος" : ""}</span></div>
        <div class="attendance-actions">
          <button type="button" class="att-btn ${status === "came" ? "on-came" : ""}" data-action="mark-attendance" data-slot="${esc(slotId)}" data-status="came" data-date="${esc(date)}" aria-label="Ήρθε">✓</button>
          <button type="button" class="att-btn ${status === "cancelled" ? "on-cancelled" : ""}" data-action="mark-attendance" data-slot="${esc(slotId)}" data-status="cancelled" data-date="${esc(date)}" aria-label="Ακύρωση">✕</button>
        </div>
      </article>`;
        }

        function renderTodayAttendance() {
          const date = isoDate();
          const rows = slotsForDate(date).map((slot) => {
            const child = db.children.find((item) => item.id === slot.childId);
            return attendanceRow(
              slot.id,
              date,
              child ? child.name : "—",
              slot.time,
              slot.duration,
              attendanceOf(slot.id, date),
              false,
            );
          });
          db.attendance
            .filter(
              (rec) => rec.date === date && rec.adhoc && rec.status !== "none",
            )
            .forEach((rec) => {
              const child = db.children.find((item) => item.id === rec.childId);
              rows.push(
                attendanceRow(
                  rec.slotId,
                  date,
                  child ? child.name : "—",
                  "—",
                  rec.duration,
                  rec,
                  true,
                ),
              );
            });
          return `<section class="list-section">

        <div class="appointment-list">${rows.length ? rows.join("") : `<div class="content-card empty-state"><b>Καμία σταθερή ώρα σήμερα</b><p>Οι συνεδρίες εκτός προγράμματος καταγράφονται αυτόματα μόλις ολοκληρωθούν.</p></div>`}</div>
      </section>`;

        function renderWeeklyPlan() {
          const groups = DAY_NAMES.map((name, day) => ({
            name,

              .filter((slot) => slot.day === day)

          const body = groups.length
            ? groups
                .map(
                  (group) => `<div class="week-group"><span class="eyebrow">${esc(group.name.toUpperCase())}</span>${group.slots
                    .map((slot) => {
                      const child = db.children.find(
                        (item) => item.id === slot.childId,

                      return `<div class="week-slot"><b>${esc(slot.time)}</b><span>${esc(child ? child.name : "—")} · ${Number(slot.duration) || 45}′</span><button type="button" class="row-menu" data-action="delete-slot" data-slot="${esc(slot.id)}" aria-label="Αφαίρεση ώρας">×</button></div>`;
                    })

          return `<section class="list-section">
        <div class="section-heading"><div><span class="eyebrow">ΣΤΑΘΕΡΕΣ ΩΡΕΣ</span><h2>Εβδομαδιαίο πρόγραμμα</h2></div><button class="section-link" data-action="add-slot">Προσθήκη ›</button></div>

        function renderSlotModal() {

      </section>
    </div>`;

      <div class="profile-goal"><span>ΚΥΡΙΟΣ ΣΤΟΧΟΣ</span><p>${esc(child.goals || "Δεν έχει καταγραφεί ακόμη θεραπευτικός στόχος.")}</p></div>
      <div class="profile-stats"><div><b>${sessions.length}</b><span>συνεδρίες</span></div><div><b>${sessions.length ? `${averageScore(sessions)}%` : "—"}</b><span>μ.ο.</span></div><div><b>${targets}</b><span>στόχοι</span></div></div>
      <div class="profile-actions"><button data-action="set-active-child" data-id="${esc(child.id)}">${active ? "Ενεργός φάκελος" : "Ενεργοποίηση"}</button><button data-action="edit-child" data-id="${esc(child.id)}">Επεξεργασία</button><button class="danger-link" data-action="delete-child" data-id="${esc(child.id)}">Διαγραφή</button></div>

          const bySound = Object.values(PHONEMES)

            .filter((item) => item.sessions.length);
          return `<div class="screen-stack">
      <div class="screen-title"><div><span class="eyebrow">ΚΛΙΝΙΚΗ ΕΙΚΟΝΑ</span><h1>Πρόοδος — ${esc(child?.name || "—")}</h1><p>Επίδοση ανά στόχο, επίπεδο και συνεδρία.</p></div></div>

        ${metricCard("green", "ΤΕΛΕΥΤΑΙΑ ΣΥΝΕΔΡΙΑ", latest ? `${latest.score}%` : "—", latest ? formatDate(latest.date) : "Χωρίς μέτρηση")}

      </section>

        function renderMore() {

      </section>

        function renderReportModal() {
          const text = buildReport(ui.reportMode);
          return `<div class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal-card report-modal">
      <div class="modal-head"><div><span class="eyebrow">ΑΥΤΟΜΑΤΟ ΠΡΟΣΧΕΔΙΟ</span><h2>Εβδομαδιαία αναφορά</h2></div><button class="close-button" data-action="close-modal">×</button></div>
      <div class="segmented-control"><button class="${ui.reportMode === "clinical" ? "active" : ""}" data-action="report-mode" data-mode="clinical">Κλινική</button><button class="${ui.reportMode === "parent" ? "active" : ""}" data-action="report-mode" data-mode="parent">Προς γονείς</button></div>

        function renderConfirmModal(title, copy, action) {
          return `<div class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal-card confirm-card"><span class="confirm-icon">!</span><h2>${esc(title)}</h2><p>${esc(copy)}</p><div class="modal-actions"><button class="secondary-button" data-action="close-modal">Ακύρωση</button><button class="danger-button" data-action="${action}">Διαγραφή</button></div></div></div>`;
        }

        // ---------- Παιχνίδια συνεδρίας ----------
        // Κάθε παιχνίδι είναι σκηνή γύρω από την ίδια αξιολόγηση: ο θεραπευτής
        // βαθμολογεί την προσπάθεια, το παιχνίδι προχωρά ένα βήμα. Καμία
        // ανταμοιβή δεν δίνεται χωρίς καταγεγραμμένη προσπάθεια.
        const PUZZLE_PICTURES = ["🦁", "🐘", "🚂", "🌈", "🐬", "🏰", "🦋", "🚀"];
        const CLEAN_ANIMALS = ["🐶", "🐱", "🐰", "🐷", "🐮"];
        // x, y σε ποσοστά μέσα στο πλαίσιο, μέγεθος σε px, κλίση σε μοίρες.
        // Επιλεγμένες ώστε να πέφτουν πάνω στο σώμα και όχι στο κενό γύρω του.
        const CLEAN_SPOTS = [
          { x: 30, y: 30, size: 34, tilt: -12 },
          { x: 62, y: 26, size: 28, tilt: 18 },
          { x: 46, y: 44, size: 40, tilt: 6 },
          { x: 24, y: 56, size: 30, tilt: -22 },
          { x: 68, y: 54, size: 32, tilt: 14 },
          { x: 40, y: 66, size: 26, tilt: -8 },
          { x: 56, y: 72, size: 30, tilt: 24 },
          { x: 33, y: 44, size: 22, tilt: 0 },
        ];
        const TREASURE_STOPS = 8;

        function initGameState(activity, items) {
          if (activity === "puzzle") {
            return {
              picture: PUZZLE_PICTURES[
                Math.floor(Math.random() * PUZZLE_PICTURES.length)
              ],
              order: shuffledValues(
                Array.from({ length: 9 }, (_, index) => index),
              ),
              cleared: 0,
            };
          }
          if (activity === "clean") {
            return {
              animal: CLEAN_ANIMALS[
                Math.floor(Math.random() * CLEAN_ANIMALS.length)
              ],
              // Σταθερές θέσεις λάσπης πάνω στο σώμα του ζώου, ανακατεμένη
              // σειρά καθαρισμού. Οι λεκέδες δεν εξαφανίζονται από το DOM —
              // ξεθωριάζουν, ώστε να φαίνεται ότι καθαρίζονται.
              spots: CLEAN_SPOTS,
              order: shuffledValues(
                Array.from({ length: CLEAN_SPOTS.length }, (_, i) => i),
              ),
              cleared: 0,
              mode: "soap",
            };
          }
          if (activity === "treasure") {
            return { step: 0, stops: TREASURE_STOPS };
          }
          if (activity === "memory") return buildMemoryDeck(items);
          if (activity === "runner") {
            return {
              speed: RUNNER_SPEEDS[ui.runnerSpeed] ? ui.runnerSpeed : "normal",
              lives: RUNNER_LIVES,
              cleared: 0,
              obstacle: null,
              jumping: false,
              jumpT: 0,
              shake: 0,
              finishing: false,
              over: false,
            };
          }
          return null;
        }

        function buildMemoryDeck(items) {
          const unique = [];
          items.forEach((item) => {
            if (!unique.some((entry) => entry.w === item.w)) unique.push(item);
          });
          const pairs = unique.slice(0, 6);
          const deck = shuffled(
            pairs.flatMap((item, index) => [
              { key: `${index}a`, pairId: index, item },
              { key: `${index}b`, pairId: index, item },
            ]),
          ).map((card) => ({ ...card, flipped: false, matched: false }));
          return { deck, first: null, second: null, awaiting: null, found: 0 };
        }

        // Προχωρά το παιχνίδι μετά από βαθμολογημένη προσπάθεια.
        function advanceGame(session) {
          const game = session.game;
          if (!game) return;
          if (session.activity === "puzzle" || session.activity === "clean") {
            game.cleared = Math.min(game.order.length, game.cleared + 1);
          } else if (session.activity === "treasure") {
            game.step = Math.min(game.stops, game.step + 1);
          } else if (session.activity === "memory") {
            if (game.awaiting !== null) {
              game.deck.forEach((card) => {
                if (card.pairId === game.awaiting) {
                  card.matched = true;
                  card.flipped = true;
                }
              });
              game.found += 1;
              game.awaiting = null;
              game.first = null;
              game.second = null;
            }
          }
        }

        // Το memory κρατά το δικό του βήμα: δύο κάρτες, ζευγάρι, μετά παραγωγή.
        function flipMemoryCard(key) {
          const session = ui.session;
          if (!session || session.activity !== "memory") return;
          const game = session.game;
          if (!game || game.awaiting !== null) return;
          // Πρώτα κλείνουμε το προηγούμενο ζευγάρι, ΜΕΤΑ βρίσκουμε την κάρτα:
          // αλλιώς κρατάμε αναφορά σε αντικείμενο που έχει αντικατασταθεί.
          if (game.first && game.second) {
            game.deck.forEach((entry) => {
              if (!entry.matched) entry.flipped = false;
            });
            game.first = null;
            game.second = null;
          }
          const card = game.deck.find((entry) => entry.key === key);
          if (!card || card.matched || card.flipped) return render();
          card.flipped = true;
          if (!game.first) {
            game.first = key;
            return render();
          }
          game.second = key;
          const firstCard = game.deck.find((entry) => entry.key === game.first);
          if (firstCard && firstCard.pairId === card.pairId) {
            game.awaiting = card.pairId;
            const index = session.items.findIndex(
              (item) => item.w === card.item.w,
            );
            if (index >= 0) session.index = index;
          }
          return render();
        }

        function memoryTargetItem(session) {
          const game = session.game;
          if (!game || game.awaiting === null) return null;
          const card = game.deck.find((entry) => entry.pairId === game.awaiting);
          return card ? card.item : null;
        }

        function renderGameStage(session, item, won) {
          const activity = session.activity;
          if (activity === "puzzle") return renderPuzzleStage(session, item);
          if (activity === "clean") return renderCleanStage(session, item);
          if (activity === "treasure") return renderTreasureStage(session, item);
          if (activity === "memory") return renderMemoryStage(session);
          if (activity === "runner") return renderRunnerStage(session);
          return renderCardStage(session, item, won);
        }

        function practiceBody(item) {
          return `<button class="speak-button" data-action="speak" data-text="${esc(item.w)}" aria-label="Ακρόαση">◖</button>
        <div class="practice-emoji">${esc(item.e || "⭐")}</div><h1>${esc(item.w)}</h1><p>${esc(item.h || "Πες τη λέξη με ήρεμο ρυθμό και καθαρή παραγωγή.")}</p>`;
        }

        function renderCardStage(session, item) {
          return `<div class="practice-stage"><article class="practice-card">
        <div class="practice-card-top"><span class="position-pill">${esc(item.pos || levelNames[session.levelKind][0])}</span></div>
        ${practiceBody(item)}
      </article></div>`;
        }

        function renderPuzzleStage(session, item) {
          const game = session.game;
          const hidden = new Set(game.order.slice(game.cleared));
          const tiles = Array.from({ length: 9 }, (_, index) =>
            `<i class="${hidden.has(index) ? "" : "open"}"></i>`,
          ).join("");
          return `<div class="practice-stage"><article class="practice-card">
        <div class="reward-progress"><span>ΠΑΖΛ ΑΠΟΚΑΛΥΨΗΣ</span><div>${Array.from({ length: 9 }, (_, index) => `<i class="${index < game.cleared ? "won" : ""}"></i>`).join("")}</div></div>
        <div class="puzzle-frame"><span class="puzzle-picture">${esc(game.picture)}</span><div class="puzzle-grid">${tiles}</div></div>
        ${practiceBody(item)}
      </article></div>`;
        }

        function renderCleanStage(session, item) {
          const game = session.game;
          const spots = game.spots || CLEAN_SPOTS;
          const cleanedSet = new Set(game.order.slice(0, game.cleared));
          const total = spots.length;
          const mud = spots
            .map((spot, index) => {
              const gone = cleanedSet.has(index);
              return `<i class="${gone ? "gone" : ""}" style="left:${spot.x}%;top:${spot.y}%;width:${spot.size}px;height:${Math.round(spot.size * 0.78)}px;--tilt:${spot.tilt}deg"></i>`;
            })
            .join("");
          const hint =
            game.mode === "soap"
              ? "Σαπούνι: κράτησε τον ήχο αργά και συνεχόμενα."
              : "Νερό: πες τη λέξη γρήγορα και καθαρά.";
          const clean = game.cleared >= total;
          return `<div class="practice-stage"><article class="practice-card">
        <div class="reward-progress"><span>${clean ? "ΚΑΘΑΡΟ!" : "ΚΑΘΑΡΙΣΕ ΤΟ ΖΩΑΚΙ"}</span><div>${Array.from({ length: total }, (_, index) => `<i class="${index < game.cleared ? "won" : ""}"></i>`).join("")}</div></div>
        <div class="clean-frame ${game.mode === "soap" ? "soapy" : "wet"} ${clean ? "sparkle" : ""}"><span class="clean-animal">${esc(game.animal)}</span><div class="clean-mud">${mud}</div>${clean ? `<span class="clean-shine">✨</span>` : ""}</div>
        <div class="clean-modes"><button type="button" class="clean-mode ${game.mode === "soap" ? "active" : ""}" data-action="clean-mode" data-mode="soap">🧼 Σαπούνι</button><button type="button" class="clean-mode ${game.mode === "water" ? "active" : ""}" data-action="clean-mode" data-mode="water">💧 Νερό</button></div>
        <div class="practice-emoji small">${esc(item.e || "🗣️")}</div><h1>${esc(item.w)}</h1><p>${esc(hint)}</p>
      </article></div>`;
        }

        function renderTreasureStage(session, item) {
          const game = session.game;
          const stops = Array.from({ length: game.stops }, (_, index) => {
            if (index === game.step) return `<i class="here">◉</i>`;
            return `<i class="${index < game.step ? "done" : ""}">•</i>`;
          }).join("");
          const done = game.step >= game.stops;
          return `<div class="practice-stage"><article class="practice-card">
        <div class="reward-progress"><span>ΚΥΝΗΓΙ ΘΗΣΑΥΡΟΥ</span><div>${Array.from({ length: game.stops }, (_, index) => `<i class="${index < game.step ? "won" : ""}"></i>`).join("")}</div></div>
        <div class="treasure-trail">${stops}<b class="treasure-chest ${done ? "open" : ""}">${done ? "🎉" : "🧰"}</b></div>
        ${practiceBody(item)}
      </article></div>`;
        }

        function renderMemoryStage(session) {
          const game = session.game;
          const target = memoryTargetItem(session);
          const cards = game.deck
            .map(
              (card) =>
                `<button type="button" class="mem-card ${card.matched ? "matched" : card.flipped ? "flipped" : ""}" data-action="flip-card" data-key="${esc(card.key)}" aria-label="${card.flipped || card.matched ? esc(card.item.w) : "Κρυμμένη κάρτα"}">${card.flipped || card.matched ? esc(card.item.e || "⭐") : "?"}</button>`,
            )
            .join("");
          return `<div class="practice-stage"><article class="practice-card memory-card-stage">
        <div class="reward-progress"><span>MEMORY ΛΕΞΕΩΝ</span><div>${Array.from({ length: 6 }, (_, index) => `<i class="${index < game.found ? "won" : ""}"></i>`).join("")}</div></div>
        <div class="mem-board">${cards}</div>
        ${target ? `<h1>${esc(target.w)}</h1><p>Βρέθηκε ζευγάρι. Πες τη λέξη και μετά αξιολόγησε.</p>` : `<p class="mem-hint">Γύρνα δύο κάρτες για να βρεις ζευγάρι.</p>`}
      </article></div>`;
        }

        // ---------- Τρέξε και μίλα ----------
        // Ο βρόχος ζει έξω από το render: το render ξαναχτίζει το HTML, οπότε
        // σταματάμε τον βρόχο πριν και τον προσαρτούμε ξανά μετά, με την
        // κατάσταση να μένει στο session.game ώστε να συνεχίζει από εκεί που ήταν.
        const RUNNER_SPEEDS = {
          calm: { label: "Ήρεμο", travel: 7000 },
          normal: { label: "Κανονικό", travel: 5000 },
          fast: { label: "Γρήγορο", travel: 3600 },
        };
        const RUNNER_TARGET = 10;
        const RUNNER_LIVES = 3;
        const HERO_AT = 0.2; // θέση ήρωα στη διαδρομή (0 = αριστερά)
        const JUMP_MS = 640;
        const JUMP_TRIGGER = 0.1; // πόσο κοντά μπαίνει το εμπόδιο πριν το άλμα

        const runnerLoop = { raf: 0, last: 0, mounted: false };

        // Παραβολικό άλμα: ανεβαίνει, περνά ΠΑΝΩ από το εμπόδιο και προσγειώνεται
        // μπροστά του. Το εμπόδιο συνεχίζει τη διαδρομή του από κάτω.
        function jumpOffset(t) {
          const clamped = Math.max(0, Math.min(1, t));
          return {
            lift: 118 * 4 * clamped * (1 - clamped),
            forward: 34 * Math.sin(Math.PI * clamped),
            tilt: -14 * Math.sin(Math.PI * clamped),
          };
        }

        function runnerDistance(game) {
          return game.obstacle ? game.obstacle.progress - HERO_AT : 1;
        }

        function shouldJump(game) {
          if (!game.obstacle || game.jumping || game.obstacle.jumped) return false;
          if (!game.obstacle.cleared) return false;
          const distance = runnerDistance(game);
          return distance <= JUMP_TRIGGER && distance > -0.12;
        }

        function shouldCollide(game) {
          if (!game.obstacle || game.obstacle.cleared) return false;
          return runnerDistance(game) <= 0;
        }

        function runnerChoices(items, correct) {
          const others = items.filter((item) => item.w !== correct.w);
          const picks = shuffled(others).slice(0, 2);
          return shuffled([correct, ...picks]);
        }

        function spawnObstacle(session) {
          const game = session.game;
          const item = session.items[session.results.length % session.items.length];
          game.obstacle = {
            item,
            choices: runnerChoices(session.items, item),
            progress: 1,
            cleared: false,
            answered: false,
            jumped: false,
          };
          game.jumping = false;
          game.jumpT = 0;
          game.shake = 0;
        }

        function runnerAnswer(word) {
          const session = ui.session;
          if (!session || session.activity !== "runner") return;
          const game = session.game;
          if (!game.obstacle || game.obstacle.answered || game.over) return;
          const correct = game.obstacle.item.w === word;
          game.obstacle.answered = true;
          game.obstacle.cleared = correct;
          session.results.push(correct ? "correct" : "retry");
          if (correct) game.cleared += 1;
          else game.lives -= 1;
          game.flash = correct ? "good" : "bad";
          if (!correct) game.shake = 1;
          paintRunner();
          if (game.lives <= 0 || game.cleared >= RUNNER_TARGET) {
            game.finishing = true;
          }
        }

        function endRunner() {
          const session = ui.session;
          stopRunnerLoop();
          if (!session) return;
          const game = session.game;
          const best = Number(db.runnerBest || 0);
          if (game.cleared > best) {
            db.runnerBest = game.cleared;
            saveDb();
          }
          session.completed = true;
          ui.modal = "notes";
          render();
        }

        function stopRunnerLoop() {
          if (runnerLoop.raf) cancelAnimationFrame(runnerLoop.raf);
          runnerLoop.raf = 0;
          runnerLoop.mounted = false;
        }

        function runnerStep(now) {
          const session = ui.session;
          if (!session || session.activity !== "runner" || ui.modal) {
            runnerLoop.raf = 0;
            return;
          }
          const game = session.game;
          const delta = runnerLoop.last ? now - runnerLoop.last : 16;
          runnerLoop.last = now;
          const travel = RUNNER_SPEEDS[game.speed].travel;

          if (game.jumping) {
            game.jumpT += delta / JUMP_MS;
            if (game.jumpT >= 1) {
              game.jumping = false;
              game.jumpT = 0;
            }
          }
          if (game.shake > 0) game.shake = Math.max(0, game.shake - delta / 420);

          if (game.obstacle) {
            game.obstacle.progress -= delta / travel;
            if (shouldJump(game)) {
              game.jumping = true;
              game.jumpT = 0;
              game.obstacle.jumped = true;
            }
            if (shouldCollide(game)) {
              if (!game.obstacle.answered) {
                game.obstacle.answered = true;
                session.results.push("retry");
                game.lives -= 1;
                game.shake = 1;
                game.flash = "bad";
                if (game.lives <= 0) game.finishing = true;
              }
              game.obstacle.cleared = false;
            }
            if (game.obstacle.progress < -0.2) {
              if (game.finishing) {
                paintRunner();
                return endRunner();
              }
              spawnObstacle(session);
            }
          }
          paintRunner();
          runnerLoop.raf = requestAnimationFrame(runnerStep);
        }

        // Ζωγραφίζει μόνο ό,τι κινείται — δεν αγγίζει το innerHTML της εφαρμογής.
        function paintRunner() {
          const session = ui.session;
          if (!session || session.activity !== "runner") return;
          const game = session.game;
          const hero = document.getElementById("rnHero");
          const obstacle = document.getElementById("rnObstacle");
          const timer = document.getElementById("rnTimer");
          const score = document.getElementById("rnScore");
          const lives = document.getElementById("rnLives");
          const prompt = document.getElementById("rnPrompt");
          const choices = document.getElementById("rnChoices");
          if (!hero || !obstacle) return;
          const jump = jumpOffset(game.jumping ? game.jumpT : 0);
          const wobble = game.shake > 0 ? Math.sin(game.shake * 34) * 6 : 0;
          hero.style.transform = `translate(${jump.forward + wobble}px, ${-jump.lift}px) rotate(${jump.tilt}deg)`;
          hero.className = `rn-hero ${game.jumping ? "jumping" : ""} ${game.shake > 0 ? "hurt" : ""}`;
          if (game.obstacle) {
            obstacle.style.left = `${game.obstacle.progress * 100}%`;
            obstacle.className = `rn-obstacle ${game.obstacle.jumped ? "passed" : ""}`;
            if (timer)
              timer.style.width = `${Math.max(0, Math.min(100, ((game.obstacle.progress - HERO_AT) / (1 - HERO_AT)) * 100))}%`;
            if (prompt && prompt.dataset.word !== game.obstacle.item.w) {
              prompt.dataset.word = game.obstacle.item.w;
              prompt.textContent = game.obstacle.item.e || "⭐";
            }
            if (choices && choices.dataset.word !== game.obstacle.item.w) {
              choices.dataset.word = game.obstacle.item.w;
              choices.innerHTML = game.obstacle.choices
                .map(
                  (choice) =>
                    `<button type="button" class="rn-choice" data-word="${esc(choice.w)}">${esc(choice.w)}</button>`,
                )
                .join("");
            }
            if (choices) {
              choices.classList.toggle("locked", game.obstacle.answered);
            }
          }
          if (score) score.textContent = String(game.cleared);
          if (lives)
            lives.textContent = "♥".repeat(Math.max(0, game.lives)) || "—";
        }

        function resultCounts(results = []) {
          return {
            correct: results.filter((value) => value === "correct").length,
            almost: results.filter((value) => value === "almost").length,
            retry: results.filter((value) => value === "retry").length,
          };
        }

        function calculateScore(counts) {
          const total = counts.correct + counts.almost + counts.retry;
          return total
            ? Math.round(((counts.correct + counts.almost * 0.5) / total) * 100)
            : 0;
        }

        function openChildModal(id = null) {

        // Η shuffled κλωνοποιεί αντικείμενα ({...item}), οπότε σε αριθμούς
        // επιστρέφει κενά αντικείμενα. Για δείκτες χρησιμοποιούμε αυτή.
        function shuffledValues(values) {
          const clone = [...values];
          for (let index = clone.length - 1; index > 0; index -= 1) {
            const swap = Math.floor(Math.random() * (index + 1));
            [clone[index], clone[swap]] = [clone[swap], clone[index]];
          }
          return clone;
        }

        function shuffled(items) {
          const clone = items.map((item) => ({ ...item }));
          for (let index = clone.length - 1; index > 0; index -= 1) {
            const swap = Math.floor(Math.random() * (index + 1));
            [clone[index], clone[swap]] = [clone[swap], clone[index]];
          }
          return clone;
        }

        function startSession(levelKind = ui.levelKind, activity = "cards") {
          if (!selectedChild()) {
            openChildModal();
            return;
          }
          ui.levelKind = levelOrder.includes(levelKind) ? levelKind : "words";
          const level = currentLevel(ui.levelKind);
          let source = [...level.items];
          const child = selectedChild();
          if (
            (ui.levelKind === "words" || ui.levelKind === "spontaneous") &&
            child?.customTargets
          ) {
            source.push(
              ...child.customTargets
                .split(/\r?\n/)
                .map((item) => item.trim())
                .filter(Boolean)
                .map((word) => ({
                  e: pictureFor(word, "⭐"),
                  w: word,
                  h: "Προσωπικός θεραπευτικός στόχος.",
                })),
            );
          }
          source = shuffled(source);
          const items = Array.from({ length: 10 }, (_, index) => ({
            ...source[index % source.length],
          }));
          const activityNames = {
            cards: "Κάρτες",
            puzzle: "Παζλ αποκάλυψης",
            memory: "Memory λέξεων",
            clean: "Καθάρισε το ζωάκι",
            treasure: "Κυνήγι θησαυρού",
            runner: "Τρέξε και μίλα",
          };
          ui.modal = null;
          ui.session = {
            soundId: ui.selectedSound,
            levelKind: ui.levelKind,
            activity,
            activityName: activityNames[activity] || "Κάρτες",
            items,
            index: 0,
            results: [],
            startedAt: Date.now(),
            completed: false,
            game: initGameState(activity, items),
          };
          render();
        }

        function showToast(message) {
          ui.toast = message;
          render();

        function downloadFile(name, content, type = "application/json") {
          const url = URL.createObjectURL(new Blob([content], { type }));
          const link = document.createElement("a");
          link.href = url;
          link.download = name;
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function exportBackup() {
          const payload = {
            ...db,
            exportedAt: new Date().toISOString(),
            source: "ΛογοΠαιχνίδι Pro Editable",
          };
          db.lastBackupAt = new Date().toISOString();
          saveDb();
          downloadFile(
            `logopaixnidi_backup_${isoDate()}.json`,
            JSON.stringify(payload, null, 2),
          );
          showToast("Το αντίγραφο ασφαλείας δημιουργήθηκε");
        }

        async function restoreBackup(file) {
          try {
            const raw = JSON.parse(await file.text());
            if (
              !raw ||
              !Array.isArray(raw.children) ||
              !Array.isArray(raw.sessions)
            )
              throw new Error("invalid");
            localStorage.setItem(
              `logopaixnidi_backup_before_restore_${Date.now()}`,
              JSON.stringify(db),
            );
            db = normalizeDb(raw);
            db.onboardingComplete = Boolean(db.children.length);
            saveDb();
            ui.screen = "today";
            ui.selectedSound = selectedChild()?.primarySoundId || "r";
            ui.modal = null;
            showToast("Τα δεδομένα επαναφέρθηκαν");
          } catch {
            window.alert(
              "Το αρχείο δεν είναι έγκυρο αντίγραφο του ΛογοΠαιχνίδι Pro.",
            );
          }
        }

        function handleClick(event) {
          const target = event.target.closest("[data-action]");
          if (!target) return;
          const action = target.dataset.action;
          if (action === "new-first-child" || action === "new-child")
            return openChildModal();
          if (action === "load-demo") {
            db = makeDemoDb();
            saveDb();
            ui.selectedSound = "r";
            ui.screen = "today";
            return render();
          }
          if (action === "nav") {
            ui.screen = target.dataset.screen || "today";
            ui.modal = null;
            return render();
          }
          if (action === "select-sound") {
            ui.selectedSound = target.dataset.sound || "r";
            const child = selectedChild();
            if (child) {
              child.primarySoundId = ui.selectedSound;
              saveDb();
            }
            return render();
          }
          if (action === "open-levels") {
            ui.modal = "levels";
            return render();
          }
          if (action === "choose-level")
            return startSession(target.dataset.level || "words");
          if (action === "start-session")
            return startSession(target.dataset.level || recommendedLevel());
          if (action === "start-game")
            return startSession(
              ui.levelKind || recommendedLevel(),
              target.dataset.game || "cards",
            );
          if (action === "open-runner") {
            if (!selectedChild()) return openChildModal();
            ui.modal = "runner";
            return render();
          }
          if (action === "add-slot") {
            if (!db.children.length) return openChildModal();
            ui.modal = "slot";
            return render();
          }
          if (action === "mark-attendance") {
            markAttendance(
              target.dataset.slot,
              target.dataset.status,
              target.dataset.date,
            );
            return render();
          }
          if (action === "delete-slot") {
            db.schedule = db.schedule.filter(
              (slot) => slot.id !== target.dataset.slot,
            );
            saveDb();
            showToast("Η σταθερή ώρα αφαιρέθηκε");
            return;
          }
          if (action === "add-appointment") {
            if (!db.children.length) return openChildModal();
            ui.modal = "appointment";
            return render();
          }
          if (action === "month-prev" || action === "month-next") {
            ui.monthDate = new Date(
              ui.monthDate.getFullYear(),
              ui.monthDate.getMonth() + (action === "month-next" ? 1 : -1),
              1,
            );
            return render();
          }
          if (action === "edit-child") return openChildModal(target.dataset.id);
          if (action === "set-active-child") {
            db.selectedChildId = target.dataset.id;
            ui.selectedSound = selectedChild()?.primarySoundId || "r";
            saveDb();
            return render();
          }
          if (action === "delete-child") {
            ui.pendingDeleteId = target.dataset.id;
            ui.modal = "delete-child";
            return render();
          }
          if (action === "confirm-delete-child") {
            const id = ui.pendingDeleteId;
            db.children = db.children.filter((item) => item.id !== id);
            db.sessions = db.sessions.filter((item) => item.childId !== id);
            db.appointments = db.appointments.filter(
              (item) => item.childId !== id,
            );
            db.selectedChildId = db.children[0]?.id || null;
            db.onboardingComplete = Boolean(db.children.length);
            ui.selectedSound = selectedChild()?.primarySoundId || "r";
            ui.modal = null;
            saveDb();
            return render();
          }
          if (action === "delete-session") {
            ui.pendingDeleteId = target.dataset.id;
            ui.modal = "delete-session";
            return render();
          }
          if (action === "confirm-delete-session") {
            db.sessions = db.sessions.filter(
              (item) => item.id !== ui.pendingDeleteId,
            );
            ui.modal = null;
            saveDb();
            return render();
          }
          if (action === "toggle-interest") {
            const value = target.dataset.interest;
            ui.draftInterests = ui.draftInterests.includes(value)
              ? ui.draftInterests.filter((item) => item !== value)
              : [...ui.draftInterests, value];
            return render();
          }
          if (action === "close-modal") {
            ui.modal = null;
            return render();
          }
          if (action === "close-session") {
            ui.modal = "close-session";
            return render();
          }
          if (action === "confirm-close-session") {
            ui.session = null;
            ui.modal = null;
            return render();
          }
          if (action === "discard-session") {
            ui.session = null;
            ui.modal = null;
            return render();
          }
          if (action === "flip-card") return flipMemoryCard(target.dataset.key);
          if (action === "clean-mode") {
            if (ui.session && ui.session.game)
              ui.session.game.mode = target.dataset.mode || "soap";
            return render();
          }
          if (action === "score") {
            if (!ui.session) return;
            if (
              ui.session.activity === "memory" &&
              ui.session.game &&
              ui.session.game.awaiting === null
            ) {
              return showToast("Βρες πρώτα ένα ζευγάρι");
            }
            advanceGame(ui.session);
            ui.session.results.push(target.dataset.score || "retry");
            const memoryDone =
              ui.session.activity === "memory" &&
              ui.session.game &&
              ui.session.game.found >= 6;
            if (
              memoryDone ||
              ui.session.results.length >= ui.session.items.length
            ) {
              ui.session.completed = true;
              ui.modal = "notes";
            } else if (ui.session.activity !== "memory") {
              ui.session.index = Math.min(
                ui.session.items.length - 1,
                ui.session.index + 1,
              );
            }
            return render();
          }
          if (action === "speak") {
            if ("speechSynthesis" in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(
                target.dataset.text || "",
              );
              utterance.lang = "el-GR";
              utterance.rate = 0.78;
              window.speechSynthesis.speak(utterance);

            ui.reportMode = "clinical";
            ui.modal = "report";
            return render();

            ui.reportMode = target.dataset.mode || "clinical";
            return render();

          if (action === "restore")
            return document.getElementById("restore-file")?.click();
          if (action === "copy-report") {
            const textarea = document.getElementById("report-text");

              navigator.clipboard
                .writeText(text)
                .then(() => showToast("Η αναφορά αντιγράφηκε"))
                .catch(() => {});
            else {
              textarea?.select();
              document.execCommand("copy");
              showToast("Η αναφορά αντιγράφηκε");
            }
            return;
          }
          if (action === "print-report") return window.print();
        }

        function handleChange(event) {
          const target = event.target;

              (entry) => entry.id === target.dataset.id,
            );

          }
          if (action === "therapist-field") {
            db.therapist[target.dataset.field] = target.value;
            saveDb();
          }
          if (target.id === "restore-file" && target.files?.[0])
            restoreBackup(target.files[0]);
        }

        function handleSubmit(event) {
          const form = event.target.closest("[data-form]");
          if (!form) return;
          event.preventDefault();
          const values = Object.fromEntries(new FormData(form).entries());
          if (form.dataset.form === "child") {
            const existing = db.children.find(
              (item) => item.id === ui.editingChildId,
            );
            const child = {
              ...(existing || {}),
              id: existing?.id || uid("child"),
              name: String(values.name || "").trim(),
              birthYear: String(values.birthYear || ""),
              goals: String(values.goals || "").trim(),
              primarySoundId: String(values.primarySoundId || "r"),
              customTargets: String(values.customTargets || "").trim(),
              interests: [...ui.draftInterests],
              createdAt: existing?.createdAt || new Date().toISOString(),
            };
            if (!child.name) return;
            if (existing)
              db.children = db.children.map((item) =>
                item.id === child.id ? child : item,
              );
            else db.children.push(child);
            db.selectedChildId = child.id;
            db.onboardingComplete = true;
            ui.selectedSound = child.primarySoundId;
            ui.modal = null;
            ui.screen = "today";
            saveDb();
            return render();
          }
          if (form.dataset.form === "appointment") {
            db.appointments.push({
              id: uid("appointment"),
              childId: values.childId,
              date: values.date,
              time: values.time,
              duration: Number(values.duration || 45),
              status: "planned",
            });
            ui.modal = null;
            saveDb();
            showToast("Το ραντεβού προστέθηκε");
            return;
          }
          if (form.dataset.form === "runner") {
            ui.runnerSpeed = RUNNER_SPEEDS[values.speed] ? values.speed : "normal";
            startSession(ui.levelKind, "runner");
            return;
          }
          if (form.dataset.form === "slot") {
            ensureLists();
            db.schedule.push({
              id: uid("slot"),
              childId: String(values.childId || ""),
              day: clampDay(values.day),
              time: String(values.time || "17:00"),
              duration: Number(values.duration || 45),
            });
            ui.modal = null;
            saveDb();
            showToast("Η σταθερή ώρα προστέθηκε");
            return;
          }
          if (form.dataset.form === "session-notes" && ui.session) {
            const counts = resultCounts(ui.session.results);
            const durationMinutes = Math.max(
              1,
              Math.round((Date.now() - ui.session.startedAt) / 60000),
            );
            db.sessions.push({
              id: uid("session"),
              childId: db.selectedChildId,
              date: new Date().toISOString(),
              soundId: ui.session.soundId,
              levelId: storedLevelIds[ui.session.levelKind],
              activity: ui.session.activity,
              activityName: ui.session.activityName,
              total: ui.session.results.length,
              ...counts,
              score: calculateScore(counts),
              durationMinutes,
              notes: {
                collaboration: values.collaboration || "",
                strengths: values.strengths || "",
                difficulties: values.difficulties || "",
                homework: values.homework || "",
              },
            });
            autoMarkAttendance(db.selectedChildId);
            ui.session = null;
            ui.modal = null;
            ui.screen = "progress";
            saveDb();
            showToast("Η συνεδρία αποθηκεύτηκε");
          }
        }

        app.addEventListener("click", handleClick);
        app.addEventListener("change", handleChange);
        app.addEventListener("submit", handleSubmit);
        window.addEventListener("online", render);
        window.addEventListener("offline", render);
        render();
      })();
    </script>
  </body>
</html>
