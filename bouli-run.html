<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Μπούλη Run 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1:#FFEFDF; --sky2:#FFDCC2; --sun:#FFC94D;
    --grass:#A9D6A0; --dirt:#E9BC85;
    --cat:#F49D37; --cat-dark:#D97E2B; --cat-belly:#FFE3BF;
    --yarn:#E56B8C; --yarn2:#5FA8A0; --cuke:#6FA84F; --cuke-dark:#4F7F38;
    --ink:#5C4033; --heart:#FF5D73; --card:#FFFDF8;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:'Nunito', sans-serif; color:var(--ink);
    background:linear-gradient(var(--sky1), var(--sky2) 70%, var(--grass) 70%);
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; }
  header { text-align:center; padding:calc(env(safe-area-inset-top) + 14px) 16px 4px; }
  header h1 { font-family:'Comfortaa', sans-serif; font-weight:700; font-size:26px; letter-spacing:.5px; }
  header h1 .paw { display:inline-block; transform:rotate(-12deg); }
  /* 5 καρδούλες προόδου — μία για κάθε εμπόδιο */
  .hearts { display:flex; gap:8px; justify-content:center; margin-top:8px; }
  .hearts span { font-size:22px; filter:grayscale(1) opacity(.35); transition:filter .3s, transform .3s; }
  .hearts span.on { filter:none; transform:scale(1.25); }
  #game { flex:1; width:100%; display:block; }
  /* Μπάνερ οδηγιών / αποτυχίας */
  .banner {
    position:fixed; left:0; right:0; bottom:18vh; text-align:center; pointer-events:none;
    font-size:17px; font-weight:800; opacity:0; transition:opacity .3s;
  }
  .banner.show { opacity:1; }
  .banner small { display:block; font-weight:600; font-size:13px; margin-top:4px; opacity:.75; }
  /* Οθόνη νίκης */
  .win {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(255, 240, 226, .55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    opacity:0; pointer-events:none; transition:opacity .5s; z-index:5; padding:24px;
  }
  .win.show { opacity:1; pointer-events:auto; }
  .win-card {
    background:var(--card); border-radius:28px; padding:34px 26px; text-align:center;
    box-shadow:0 18px 50px rgba(92,64,51,.25); max-width:420px; width:100%;
    transform:scale(.8); transition:transform .5s cubic-bezier(.2,1.6,.4,1);
  }
  .win.show .win-card { transform:scale(1); }
  .win-msg {
    font-family:'Comfortaa', sans-serif; font-weight:700;
    font-size:clamp(24px, 7vw, 34px); line-height:1.35; color:var(--heart);
  }
  .win-msg .w { display:inline-block; }
  .win.show .win-msg .w { animation:pop .55s cubic-bezier(.2,1.8,.4,1) both; }
  @keyframes pop { from { transform:translateY(18px) scale(.3); opacity:0; } to { transform:none; opacity:1; } }
  .win-sub { margin-top:14px; font-size:15px; font-weight:600; opacity:.7; }
  .again {
    margin-top:22px; border:none; background:var(--heart); color:#fff; cursor:pointer;
    font-family:'Comfortaa', sans-serif; font-weight:700; font-size:16px;
    padding:13px 34px; border-radius:999px; box-shadow:0 8px 20px rgba(255,93,115,.4);
  }
  .again:active { transform:scale(.94); }
  /* Καρδιές που πέφτουν στη νίκη */
  .fall { position:fixed; top:-40px; font-size:26px; z-index:4; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(115vh) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .fall { display:none; }
    .win.show .win-msg .w { animation:none; }
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1><span class="paw">🐾</span> Μπούλη Run</h1>
    <div class="hearts" id="hearts">
      <span>❤️</span><span>❤️</span><span>❤️</span><span>❤️</span><span>❤️</span>
    </div>
  </header>
  <canvas id="game"></canvas>
</div>

<div class="banner show" id="banner">Πάτα για να τρέξει η γατούλα! 🐱<small>Πάτα ξανά για να πηδήξει πάνω από 5 εμπόδια</small></div>

<div class="win" id="win">
  <div class="win-card">
    <div class="win-msg" id="winMsg"></div>
    <div class="win-sub">Η γατούλα πέρασε και τα 5 εμπόδια για σένα 🐾</div>
    <button class="again" id="again">Ξανά! 🐱</button>
  </div>
</div>

<script>
// ================== Μπούλη Run — dino-style game με γατούλα ==================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const banner = document.getElementById('banner');
const heartsEls = document.querySelectorAll('#hearts span');
const WIN_TEXT = "ΜΠΡΆΒΟΟΟΟ ΜΠΟΥΛΗΗΗ ΜΟΥ Σ' ΑΓΑΠΏ ΠΟΛΥΥΥ ❤️";
const TOTAL = 5; // πόσα εμπόδια για τη νίκη

let W = 0, H = 0, GROUND = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  GROUND = H * 0.78;
}
window.addEventListener('resize', resize);

// ---------- Κατάσταση παιχνιδιού ----------
const G = {
  state: 'idle',           // idle | run | fail | win
  t: 0,
  speed: 340,              // px/s — ξεκινά ήρεμα
  cat: { x: 0, y: 0, vy: 0, w: 74, h: 52, onGround: true, legPhase: 0, blink: 0 },
  obstacles: [],           // {x, type, w, h, cleared}
  spawned: 0, cleared: 0,
  clouds: [],
};
const GRAVITY = 1900, JUMP_V = -900; // αέρινο, γατίσιο άλμα (~0.86s στον αέρα)

function reset() {
  G.state = 'idle'; G.t = 0; G.speed = 300;
  G.cat.x = Math.max(60, W * 0.16); G.cat.y = GROUND; G.cat.vy = 0; G.cat.onGround = true;
  G.obstacles = []; G.spawned = 0; G.cleared = 0;
  G.clouds = [0,1,2].map(i => ({ x: W*0.2 + i*W*0.35, y: H*(0.12+0.09*i), s: 0.7+0.3*i }));
  heartsEls.forEach(h => h.classList.remove('on'));
  document.getElementById('win').classList.remove('show');
  banner.innerHTML = 'Πάτα για να τρέξει η γατούλα! 🐱<small>Πάτα ξανά για να πηδήξει πάνω από 5 εμπόδια</small>';
  banner.classList.add('show');
}

function spawnObstacle() {
  const type = G.spawned % 2 === 0 ? 'yarn' : 'cuke'; // κουβάρι / αγγούρι (οι γάτες τα τρέμουν!)
  const size = G.spawned === TOTAL - 1 ? 1.25 : 1;    // το τελευταίο λίγο πιο μεγάλο — φινάλε!
  G.obstacles.push({
    x: W + 60,
    type,
    w: (type === 'yarn' ? 46 : 58) * size,
    h: (type === 'yarn' ? 46 : 34) * size,
    yarnColor: G.spawned % 4 === 0 ? 'var(--yarn)' : 'var(--yarn2)',
    cleared: false, roll: 0,
  });
  G.spawned++;
}

function jump() {
  if (G.cat.onGround) { G.cat.vy = JUMP_V; G.cat.onGround = false; }
}

function tap() {
  if (G.state === 'idle' || G.state === 'fail') {
    if (G.state === 'fail') reset();
    G.state = 'run';
    banner.classList.remove('show');
    G._nextSpawn = 1.1; // πρώτο εμπόδιο μετά από ~1.1s
  } else if (G.state === 'run') {
    jump();
  }
}
window.addEventListener('pointerdown', e => { if (!e.target.closest('.again')) tap(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); tap(); } });

// ---------- Λογική βήματος (καθαρή συνάρτηση για να τεστάρεται) ----------
function step(dt) {
  G.t += dt;
  // σύννεφα κινούνται πάντα, αργά
  G.clouds.forEach(c => { c.x -= dt * 18 * c.s; if (c.x < -80) c.x = W + 80; });

  if (G.state !== 'run') return;

  // γάτα: βαρύτητα
  if (!G.cat.onGround) {
    G.cat.vy += GRAVITY * dt;
    G.cat.y += G.cat.vy * dt;
    if (G.cat.y >= GROUND) { G.cat.y = GROUND; G.cat.vy = 0; G.cat.onGround = true; }
  }
  G.cat.legPhase += dt * 14;

  // spawn έως 5 εμπόδια, με μικρή κλιμάκωση ταχύτητας
  if (G.spawned < TOTAL) {
    G._nextSpawn -= dt;
    if (G._nextSpawn <= 0) {
      spawnObstacle();
      G._nextSpawn = 1.45 + Math.random() * 0.7; // ανθρώπινο, όχι μετρονόμος
      G.speed += 16;
    }
  }

  // εμπόδια
  for (const o of G.obstacles) {
    o.x -= G.speed * dt;
    o.roll += dt * G.speed / 22;
    // πέρασμα εμποδίου
    if (!o.cleared && o.x + o.w < G.cat.x - G.cat.w/2) {
      o.cleared = true;
      G.cleared++;
      heartsEls[G.cleared - 1]?.classList.add('on');
      if (G.cleared >= TOTAL) { winGame(); return; }
    }
    // σύγκρουση (με επιείκεια στα άκρα — παιχνίδι αγάπης, όχι τιμωρίας)
    const catL = G.cat.x - G.cat.w/2 + 18, catR = G.cat.x + G.cat.w/2 - 18;
    const catB = G.cat.y, catT = G.cat.y - G.cat.h + 8;
    const obL = o.x + 9, obR = o.x + o.w - 9, obT = GROUND - o.h + 9;
    if (catR > obL && catL < obR && catB > obT) {
      G.state = 'fail';
      banner.innerHTML = 'Ώωωπ! 🙀 Η γατούλα σκόνταψε.<small>Πάτα για να ξαναπροσπαθήσει — το αξίζεις!</small>';
      banner.classList.add('show');
      return;
    }
  }
  G.obstacles = G.obstacles.filter(o => o.x > -100);
}

function winGame() {
  G.state = 'win';
  const msgEl = document.getElementById('winMsg');
  msgEl.innerHTML = WIN_TEXT.split(' ').map((w, i) =>
    `<span class="w" style="animation-delay:${i * 0.13}s">${w}</span>`
  ).join(' ');
  document.getElementById('win').classList.add('show');
  // βροχή από καρδιές
  const em = ['❤️','💖','💕','😻','🐾','💘'];
  for (let i = 0; i < 46; i++) {
    setTimeout(() => {
      const s = document.createElement('span');
      s.className = 'fall';
      s.textContent = em[Math.floor(Math.random() * em.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = (18 + Math.random() * 22) + 'px';
      s.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 5500);
    }, i * 90);
  }
}
document.getElementById('again').addEventListener('click', () => { reset(); });

// ---------- Ζωγραφική ----------
function drawCat() {
  const c = G.cat, x = c.x, y = c.y;
  const jumpTuck = c.onGround ? 0 : 1;
  ctx.save();
  ctx.translate(x, y);
  // ουρά — κυματίζει
  ctx.strokeStyle = getVar('--cat'); ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath();
  const tw = Math.sin(G.t * 6) * 8;
  ctx.moveTo(-c.w/2 + 6, -20);
  ctx.quadraticCurveTo(-c.w/2 - 20, -34 + tw, -c.w/2 - 26, -52 + tw * 1.4);
  ctx.stroke();
  // πόδια (τρέξιμο ή μαζεμένα στο άλμα)
  ctx.lineWidth = 8;
  ctx.strokeStyle = getVar('--cat-dark');
  for (let i = 0; i < 4; i++) {
    const px = -c.w/2 + 14 + i * 15;
    const swing = jumpTuck ? 6 : Math.sin(c.legPhase + i * Math.PI/1.6) * 9;
    ctx.beginPath();
    ctx.moveTo(px, -14);
    ctx.lineTo(px + swing * 0.6, jumpTuck ? -6 : 0);
    ctx.stroke();
  }
  // σώμα
  ctx.fillStyle = getVar('--cat');
  rr(-c.w/2, -c.h + 8, c.w, c.h - 16, 20); ctx.fill();
  // κοιλίτσα
  ctx.fillStyle = getVar('--cat-belly');
  rr(-c.w/2 + 12, -c.h/2 + 2, c.w - 34, c.h/2 - 12, 12); ctx.fill();
  // ρίγες
  ctx.strokeStyle = getVar('--cat-dark'); ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-6 + i * 11, -c.h + 10);
    ctx.quadraticCurveTo(-2 + i * 11, -c.h + 20, -6 + i * 11, -c.h + 26);
    ctx.stroke();
  }
  // κεφάλι
  const hx = c.w/2 - 6, hy = -c.h + 4;
  ctx.fillStyle = getVar('--cat');
  ctx.beginPath(); ctx.arc(hx, hy, 20, 0, Math.PI * 2); ctx.fill();
  // αυτιά
  ctx.beginPath();
  ctx.moveTo(hx - 16, hy - 10); ctx.lineTo(hx - 12, hy - 26); ctx.lineTo(hx - 2, hy - 16);
  ctx.moveTo(hx + 16, hy - 10); ctx.lineTo(hx + 12, hy - 26); ctx.lineTo(hx + 2, hy - 16);
  ctx.fill();
  ctx.fillStyle = '#F9C0C0';
  ctx.beginPath();
  ctx.moveTo(hx - 13, hy - 13); ctx.lineTo(hx - 11.5, hy - 21); ctx.lineTo(hx - 6, hy - 15); ctx.fill();
  // μάτια (blink κάθε ~3s)
  c.blink = (c.blink + 0.016) % 3.2;
  const open = c.blink > 0.12;
  ctx.fillStyle = '#3B2B22';
  if (open) {
    ctx.beginPath(); ctx.arc(hx - 6, hy - 2, 2.6, 0, Math.PI*2); ctx.arc(hx + 7, hy - 2, 2.6, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.lineWidth = 2; ctx.strokeStyle = '#3B2B22';
    ctx.beginPath(); ctx.moveTo(hx - 9, hy - 2); ctx.lineTo(hx - 3, hy - 2);
    ctx.moveTo(hx + 4, hy - 2); ctx.lineTo(hx + 10, hy - 2); ctx.stroke();
  }
  // μύτη + μουστάκια
  ctx.fillStyle = '#E58BA0';
  ctx.beginPath(); ctx.arc(hx + 1, hy + 5, 2.4, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(59,43,34,.55)'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(hx + 6, hy + 5); ctx.lineTo(hx + 20, hy + 2);
  ctx.moveTo(hx + 6, hy + 7); ctx.lineTo(hx + 20, hy + 9);
  ctx.moveTo(hx - 4, hy + 5); ctx.lineTo(hx - 18, hy + 2);
  ctx.moveTo(hx - 4, hy + 7); ctx.lineTo(hx - 18, hy + 9);
  ctx.stroke();
  ctx.restore();
}

function drawObstacle(o) {
  const baseY = GROUND;
  ctx.save();
  if (o.type === 'yarn') {
    // κουβάρι που κυλάει
    const r = o.w / 2, cx = o.x + r, cy = baseY - r;
    ctx.translate(cx, cy); ctx.rotate(o.roll);
    ctx.fillStyle = getVar(o.yarnColor === 'var(--yarn)' ? '--yarn' : '--yarn2');
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.ellipse(0, 0, r - 5, (r - 5) * (0.35 + 0.25 * Math.abs(i)), i * 0.7, 0, Math.PI * 2); ctx.stroke();
    }
  } else {
    // αγγούρι — ο τρόμος κάθε γάτας 😹
    const cx = o.x + o.w/2, cy = baseY - o.h/2;
    ctx.translate(cx, cy); ctx.rotate(-0.12);
    ctx.fillStyle = getVar('--cuke');
    rr(-o.w/2, -o.h/2, o.w, o.h, o.h/2); ctx.fill();
    ctx.strokeStyle = getVar('--cuke-dark'); ctx.lineWidth = 2.5;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(-o.w/2 + 10, i * o.h/4);
      ctx.quadraticCurveTo(0, i * o.h/4 + 3, o.w/2 - 10, i * o.h/4);
      ctx.stroke();
    }
    ctx.fillStyle = getVar('--cuke-dark');
    ctx.beginPath(); ctx.arc(-o.w/2 + 4, 0, 4, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
const cssVars = {};
function getVar(name) {
  if (!cssVars[name]) cssVars[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#F49D37';
  return cssVars[name];
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // ήλιος
  ctx.fillStyle = getVar('--sun');
  ctx.beginPath(); ctx.arc(W * 0.82, H * 0.14, 34, 0, Math.PI * 2); ctx.fill();
  // σύννεφα
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  G.clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 16 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 18 * c.s, c.y + 4, 13 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x - 18 * c.s, c.y + 5, 12 * c.s, 0, Math.PI * 2);
    ctx.fill();
  });
  // έδαφος
  ctx.fillStyle = getVar('--dirt');
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = getVar('--grass');
  ctx.fillRect(0, GROUND, W, 12);
  // λουλουδάκια στο γρασίδι
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 6; i++) {
    const fx = ((i * 173 + G.t * (G.state==='run' ? G.speed : 20) * -1) % (W + 60) + W + 60) % (W + 60) - 30;
    ctx.beginPath(); ctx.arc(fx, GROUND + 6, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  G.obstacles.forEach(drawObstacle);
  drawCat();
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
reset();
requestAnimationFrame(loop);

// hook για αυτοματοποιημένο τεστ (αθόρυβο, δεν επηρεάζει το παιχνίδι)
window.__game = { G, step, tap, jump, reset, GROUND: () => GROUND };
</script>
</body>
</html>
